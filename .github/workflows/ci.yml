name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：本 workflow 只需要读取源码；不使用任何 write 权限。
# 需要凭证的步骤（checkout / cache / artifact）由 runner 的 Actions 运行时
# 自行携带临时 token，不需要给 GITHUB_TOKEN 任何写权限。
# 校验工具：tools/check_workflow_policy.py（禁止 *: write，必须 contents: read）
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

# ---------------------------------------------------------------------------
# CI JOB INVENTORY —— 由 tools/check_ci_jobs.py 自动校验，**禁止手工改数字**
#
#   job                    matrix 维度            展开数量   备注
#   build                  hugo-version x4        4
#   subdir                 -                      1
#   static-checks          -                      1
#   browser-tests          browser x3             3
#   release-full-audit     browser x3             3          仅 tag 推送
#
# 改动 matrix（加/删浏览器、加 Hugo 版本等）必须同步更新下面两行，
# 否则 tools/check_ci_jobs.py 判定失败，CI 变红。
#
# CI-JOBS: build=4
# CI-JOBS: subdir=1
# CI-JOBS: static-checks=1
# CI-JOBS: browser-tests=3
# CI-JOBS: release-full-audit=3
# CI-JOBS-TOTAL: 12
# CI-JOBS-PUSH-TOTAL: 9        （非 tag 推送：Release job 被 if 跳过）
# ---------------------------------------------------------------------------
jobs:
  # ---------------------------------------------------------------- 构建矩阵
  build:
    name: Build (Hugo ${{ matrix.hugo-version }})
    # 需要上传构建产物：沿用顶层 contents: read（artifact 走 Actions 运行时凭证）
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        hugo-version: ['0.128.0', '0.162.0', '0.167.0', 'latest']
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: ${{ matrix.hugo-version }}
          extended: true

      - name: Generate stress test data
        run: python3 tools/gen_testdata.py --posts-dir exampleSite/content/posts

      - name: Build exampleSite (production)
        run: hugo --source exampleSite --themesDir ../.. --gc --minify -d ../public

      - name: Check required artifacts
        run: |
          set -e
          for f in public/index.html public/index.json public/sitemap.xml public/robots.txt \
                   public/404.html public/index.xml public/favicon.ico; do
            test -f "$f" || { echo "缺少产物: $f"; exit 1; }
          done
          echo "产物齐全"

      - name: Check search index integrity (full-text, no truncation)
        run: python3 tools/check_index.py public/index.json

      - name: Check draft/future pages are excluded
        run: |
          set -e
          test ! -d public/posts/zz-14-draft && echo "草稿已正确排除"
          test ! -d public/posts/zz-15-future && echo "未来文章已正确排除"

      - name: Check no dev-only injection
        run: |
          set -e
          if grep -rq "livereload" public/; then
            echo "生产产物中不应包含 livereload"; exit 1; fi
          echo "无开发环境注入"

      - name: Upload build artifact (for release audit reuse)
        if: matrix.hugo-version == '0.167.0'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: public-zh-cn
          path: public

  # ------------------------------------------------------- 子目录 / baseURL
  subdir:
    name: Sub-directory baseURL
    # 只检出源码后本地构建，不写 anything —— 连 contents: read 都不需要
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.167.0'
          extended: true
      - name: Generate stress test data
        run: python3 tools/gen_testdata.py --posts-dir exampleSite/content/posts
      - name: Build with /blog/ baseURL
        run: hugo --source exampleSite --themesDir ../.. --gc --minify --baseURL "https://example.com/blog/" -d ../public-blog
      - name: Verify paths carry /blog/ prefix
        run: |
          set -e
          python3 - <<'PY'
          import re
          html = open('public-blog/index.html', encoding='utf-8').read()
          links = re.findall(r'(?:href|src)=["\']?(/[^"\'> ]+)', html)
          bad = [l for l in links if not l.startswith('/blog/')]
          dup = [l for l in links if l.startswith('/blog/blog/')]
          print(f'检查 {len(links)} 个站内路径引用')
          assert not bad, f'跳出 baseURL 的路径: {bad[:5]}'
          assert not dup, f'basePath 重复: {dup[:5]}'
          print('子目录路径检查通过')
          PY

  # ------------------------------------------------------------- 静态检查
  static-checks:
    name: Static checks (links / index / features / i18n / sections)
    # setup-python 的 pip 缓存由 Actions 运行时凭证处理，无需 GITHUB_TOKEN 写权限
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.167.0'
          extended: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install python deps
        run: python3 -m pip install -r tools/requirements.txt
      - name: Generate stress test data
        run: python3 tools/gen_testdata.py --posts-dir exampleSite/content/posts
      - name: Build (production)
        run: hugo --source exampleSite --themesDir ../.. --gc --minify -d ../public
      - name: Internal link check (dead links)
        run: python3 tools/link_check.py public
      - name: Search index integrity
        run: python3 tools/check_index.py public/index.json

      - name: Feature checks (images / series / RSS / SEO / i18n injection)
        run: python3 tools/check_features.py public

      - name: i18n static check — no hardcoded UI text in layouts/js
        run: python3 tools/check_i18n_hardcode.py

      - name: i18n — build zh-CN / zh-TW / en
        run: |
          set -e
          hugo --source exampleSite --themesDir ../.. --gc --minify \
               --config hugo.toml,"$GITHUB_WORKSPACE/tools/lang-en.toml" -d ../public-en
          hugo --source exampleSite --themesDir ../.. --gc --minify \
               --config hugo.toml,"$GITHUB_WORKSPACE/tools/lang-zh-TW.toml" -d ../public-zh-tw

      - name: i18n — verify UI strings really come from i18n
        run: |
          set -e
          python3 tools/verify_i18n.py public zh-CN
          python3 tools/verify_i18n.py public-en en
          python3 tools/verify_i18n.py public-zh-tw zh-TW

      - name: Multi-section regression (posts / tutorials / notes / projects)
        env:
          SITE_DIR: exampleSite
          HUGO_ARGS: '--source . --themesDir ../..'
        run: python3 tools/verify_multisection.py

      - name: HTML inventory (build-product truth for Release audit)
        run: python3 tools/html_inventory.py public --json tools/html_inventory.json

      - name: Alias pages - static structure check (meta refresh / canonical / target / lang)
        run: python3 tools/check_alias_pages.py public

      - name: Search date contract - date machine field + dateDisplay per language
        env:
          SITE_DIR: exampleSite
          HUGO_ARGS: '--source . --themesDir ../..'
        run: python3 tools/check_search_date.py

      - name: Pagination crawler - article classification + custom pagination.path
        run: python3 tools/check_article_classification.py

      - name: CI job inventory (job count must be derived, never hand-written)
        env:
          CI_REPORT: '1'
        run: python3 tools/check_ci_jobs.py

      - name: Workflow policy (least privilege / pinned runner / Node24 actions)
        run: python3 tools/check_workflow_policy.py

      - name: Documentation consistency (CDN wording / third-party services / CHANGELOG)
        env:
          DOC_VERSION: '1.0.9'
        run: python3 tools/check_docs.py

      - name: Date format consistency (UI dates via i18n, machine formats whitelisted)
        run: python3 tools/check_date_format.py

      - name: HTML quality (alt / button type / dup id / nesting / heading / aria / noopener)
        run: python3 tools/check_html_quality.py public

      - name: Security baseline (javascript:/vbscript:/empty href/noopener/inline handler/3rd-party)
        run: python3 tools/security_baseline.py public

      - name: Pagination discovery retry semantics (4 scenarios)
        run: python3 tools/test_pagination_retry.py

      - name: Inventory self-consistency (URL normalization + collision guard)
        run: python3 tools/test_inventory.py

      - name: SEO and feeds (robots / sitemap / RSS / description / test-data leak)
        run: python3 tools/check_seo.py public

      - name: Comments - provider rendering, locale follows site language, off means no third-party
        env:
          HUGO_BIN: hugo
        run: python3 tools/check_comments.py

      - name: Pagination discovery - queue-exhaustion crawl (1/3/10/100 pages, term and multi-section)
        env:
          HUGO_BIN: hugo
        run: python3 tools/check_pagination.py

      - name: Multilingual regression - real zh-CN + en build (hreflang / canonical / og / search / series)
        env:
          HUGO_BIN: hugo
        run: python3 tools/verify_multilingual.py

      - name: Auto shard threshold check
        run: |
          set -e
          printf '\n[params.search]\n  mode = "auto"\n  autoThreshold = 1000\n' > exampleSite/shard-auto.toml
          hugo --source exampleSite --themesDir ../.. --config hugo.toml,shard-auto.toml \
               --gc --minify -d ../public-auto
          test -d public-auto/search || { echo "auto 模式未按阈值分片"; exit 1; }
          echo "auto 分片数: $(ls public-auto/search | wc -l)"
          test $(ls public-auto/search | wc -l) -gt 0

  # --------------------------------------------------------- 浏览器端测试
  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    # 需要 playwright 缓存 + 上传审计报告：仍是只读仓库权限即可
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - browser: chromium
            viewports: '320,375,390,430,768,1024,1440'
          - browser: firefox
            viewports: '375,768,1440'
          - browser: webkit
            viewports: '375,768,1440'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.167.0'
          extended: true

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install Python deps (playwright + pillow)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tools/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pw-${{ runner.os }}-${{ matrix.browser }}-

      - name: Install browser (${{ matrix.browser }})
        run: python3 -m playwright install --with-deps ${{ matrix.browser }}

      - name: Generate stress test data
        run: python3 tools/gen_testdata.py --posts-dir exampleSite/content/posts

      - name: Build (production)
        run: hugo --source exampleSite --themesDir ../.. --gc --minify -d ../public

      - name: Build en / zh-TW (for accessible-name checks)
        run: |
          cp tools/lang-en.toml exampleSite/_ci-en.toml
          cp tools/lang-zh-TW.toml exampleSite/_ci-zhtw.toml
          hugo --source exampleSite --themesDir ../.. --gc --minify \
               --config hugo.toml,_ci-en.toml -d ../public-en
          hugo --source exampleSite --themesDir ../.. --gc --minify \
               --config hugo.toml,_ci-zhtw.toml -d ../public-zh-tw
          rm -f exampleSite/_ci-en.toml exampleSite/_ci-zhtw.toml

      - name: Build (shard search mode, small chunkSize to force >= 2 chunks)
        run: |
          printf '\n[params.search]\n  mode = "shard"\n  chunkSize = 40000\n' > exampleSite/shard-override.toml
          hugo --source exampleSite --themesDir ../.. --config hugo.toml,shard-override.toml \
               --gc --minify -d ../public-shard
          echo "分片数: $(ls public-shard/search | wc -l)"
          test -f public-shard/index.json
          test $(ls public-shard/search | wc -l) -ge 2 || { echo "需要 >= 2 个分块用于失败语义测试"; exit 1; }

      - name: Start static servers
        run: |
          nohup python3 tools/serve.py public 8080 > /tmp/serve-main.log 2>&1 &
          nohup python3 tools/serve.py public-shard 8090 > /tmp/serve-shard.log 2>&1 &
          nohup python3 tools/serve.py public-en 8081 > /tmp/serve-en.log 2>&1 &
          nohup python3 tools/serve.py public-zh-tw 8082 > /tmp/serve-zhtw.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -sf http://127.0.0.1:8080/ > /dev/null && curl -sf http://127.0.0.1:8090/ > /dev/null \
               && curl -sf http://127.0.0.1:8081/ > /dev/null && curl -sf http://127.0.0.1:8082/ > /dev/null; then
              echo "servers ready"; break; fi
            sleep 1
          done
          curl -sf -o /dev/null -w "main:%{http_code}\n" http://127.0.0.1:8080/
          curl -sf -o /dev/null -w "shard:%{http_code}\n" http://127.0.0.1:8090/

      - name: Audit — responsive / console / 404 / overflow (fails on any problem)
        env:
          AUDIT_BROWSERS: ${{ matrix.browser }}
          AUDIT_VIEWPORTS: ${{ matrix.viewports }}
        run: python3 tools/audit.py http://127.0.0.1:8080

      - name: Interactions — search / theme / menu / copy / toc / pager / keyboard / no-JS
        env:
          PW_BROWSERS: ${{ matrix.browser }}
        run: python3 tools/interactions.py http://127.0.0.1:8080

      - name: Copy semantics — reject / pending timeout / execCommand=false must NOT show success
        run: python3 tools/verify_copy.py http://127.0.0.1:8080 ${{ matrix.browser }}

      - name: Lightbox — dialog / focus trap / keyboard / linked images
        run: python3 tools/verify_lightbox.py http://127.0.0.1:8080 ${{ matrix.browser }}

      - name: Search modal accessibility — 14 checks (focus trap / inert / restore / deep link / i18n)
        env:
          SEARCH_MODAL_URLS: 'http://127.0.0.1:8081,http://127.0.0.1:8082'
        run: python3 tools/verify_search_modal.py http://127.0.0.1:8080 ${{ matrix.browser }}

      - name: Search edge cases & race conditions
        if: matrix.browser == 'chromium'
        env:
          SEARCH_DATE_LOCALE: 'zh-CN'
        run: python3 tools/verify_search_edge.py http://127.0.0.1:8080

      - name: Search date i18n in rendered results (en build must show "Sep 28, 2026")
        if: matrix.browser == 'chromium'
        env:
          SEARCH_DATE_LOCALE: 'en'
        run: python3 tools/verify_search_edge.py http://127.0.0.1:8081

      - name: Search highlight - HTML entities & regex/XSS safety on & < > " '
        if: matrix.browser == 'chromium'
        run: python3 tools/verify_search_highlight.py http://127.0.0.1:8080 chromium

      - name: Search shard failure handling + deep-keyword semantics
        if: matrix.browser == 'chromium'
        run: python3 tools/verify_search_shard.py http://127.0.0.1:8090 ${{ matrix.browser }}

      - name: Three baseURL deployments (/, /blog/, /blog/sub/)
        if: matrix.browser == 'chromium'
        env:
          SITE_DIR: exampleSite
          HUGO_ARGS: '--source . --themesDir ../..'
        run: python3 tools/verify_baseurl.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: audit-report-${{ matrix.browser }}
          path: tools/audit_report.json
          if-no-files-found: ignore

  # ------------------------------------------- Release 门禁：全站页面完整扫描
  # Release 全站审计以构建产物 HTML inventory 为真值；sitemap 仅为独立 SEO 索引质量检查。
  # 三条独立证据链，彼此不互相冒充：
  #   1. 构建产物 HTML inventory -> 100% 浏览器加载审计
  #   2. pagination crawler      -> 交叉验证所有可爬取的分页页均被覆盖
  #   3. tools/check_alias_pages.py -> alias 页的 meta-refresh 结构（浏览器会重定向，
  #      加载 alias 观察到的其实是目标页，因此必须单独静态验证）
  # sitemap 仅作为 SEO 索引质量检查，不作为全站真值。
  release-full-audit:
    name: Release full-site audit (${{ matrix.browser }})
    # 仅 tag 推送（v*）或手动触发时执行，避免拖慢每次 PR
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.167.0'
          extended: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tools/requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-release-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pw-release-${{ runner.os }}-${{ matrix.browser }}-
      - run: python3 -m playwright install --with-deps ${{ matrix.browser }}
      - name: Generate stress data + build
        run: |
          python3 tools/gen_testdata.py --posts-dir exampleSite/content/posts
          hugo --source exampleSite --themesDir ../.. --gc --minify -d ../public
      - name: Link check (整站)
        run: python3 tools/link_check.py public
      - name: HTML inventory + quality (与 audit 交叉验证)
        run: |
          python3 tools/html_inventory.py public --json tools/html_inventory.json
          python3 tools/check_html_quality.py public
      - name: Alias pages - static structure check (browser audit loads them, this verifies them)
        run: python3 tools/check_alias_pages.py public
      - name: Start server
        run: |
          nohup python3 tools/serve.py public 8080 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 25); do curl -sf http://127.0.0.1:8080/ > /dev/null && break; sleep 1; done
          curl -sf -o /dev/null -w "main:%{http_code}\n" http://127.0.0.1:8080/
      - name: Full-site audit (AUDIT_FULL=1, build-product inventory truth)
        env:
          AUDIT_FULL: '1'
          AUDIT_BROWSERS: ${{ matrix.browser }}
          AUDIT_VIEWPORTS: '320,375,768,1440'
        run: python3 tools/audit.py http://127.0.0.1:8080
      - name: Release copy semantics (copy must never fake success)
        run: python3 tools/verify_copy.py http://127.0.0.1:8080 ${{ matrix.browser }}
      - name: Release interactions (search / theme / keyboard / no-JS)
        env:
          PW_BROWSERS: ${{ matrix.browser }}
        run: python3 tools/interactions.py http://127.0.0.1:8080
      - name: Upload release audit report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-audit-report-${{ matrix.browser }}
          path: tools/audit_report.json
          if-no-files-found: ignore
