name: Compat latest

# 最新环境兼容性检查（**不是**生产门禁）
#
# 生产门禁（ci.yml）有意把 runner 固定为 ubuntu-24.04：GitHub 已宣布
# ubuntu-latest 将于 2026-10-19 起迁移到 Ubuntu 26.04，长期基线不该在下一次
# 平台迁移时悄悄改变底层 OS。
#
# 但"固定"不等于"不管新环境"：本 workflow 在 ubuntu-latest 上跑一遍核心流程，
# 提前发现新系统镜像 / 新 runner 带来的问题。结果仅供参考，不作为发布判定依据。
# 生产门禁的 runner 与 job 结构请见 .github/workflows/ci.yml。

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'      # 每周一 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  latest-runner:
    name: Latest runner smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: 'latest'
          extended: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tools/requirements.txt
      - name: Report runner image
        run: |
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          cat /etc/os-release | head -3
          hugo version
      - name: Generate stress test data + build
        run: |
          python3 tools/gen_testdata.py --posts-dir exampleSite/content/posts
          hugo --source exampleSite --themesDir ../.. --gc --minify -d ../public
      - name: Core static checks on the latest image
        run: |
          python3 tools/check_index.py public/index.json
          python3 tools/link_check.py public
          python3 tools/check_html_quality.py public
          python3 tools/check_alias_pages.py public
          python3 tools/check_ci_jobs.py
          python3 tools/check_workflow_policy.py
      - name: Install chromium + browser smoke (sampled audit)
        run: |
          python3 -m playwright install --with-deps chromium
      - name: Start static server
        run: |
          nohup python3 tools/serve.py public 8080 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 25); do curl -sf http://127.0.0.1:8080/ > /dev/null && break; sleep 1; done
          curl -sf -o /dev/null -w "main:%{http_code}\n" http://127.0.0.1:8080/
      - name: Sampled audit + interactions + search highlight
        env:
          AUDIT_BROWSERS: chromium
          AUDIT_VIEWPORTS: '375,1440'
          PW_BROWSERS: chromium
        run: |
          python3 tools/audit.py http://127.0.0.1:8080
          python3 tools/interactions.py http://127.0.0.1:8080
          python3 tools/verify_search_highlight.py http://127.0.0.1:8080 chromium
