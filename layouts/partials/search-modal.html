{{ if site.Params.search.enable | default true }}
<div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-label="站内搜索">
  <div class="search-modal">
    <div class="search-input-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search-input" type="text" placeholder="搜索文章标题、正文、标签…" autocomplete="off" spellcheck="false">
      <span style="font-size:12px;color:var(--text-muted)">ESC 关闭</span>
    </div>
    <div class="search-results" id="searchResults"></div>
    <div class="search-hint">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>Enter</kbd> 打开</span>
      <span id="searchCount"></span>
    </div>
  </div>
</div>
{{ end }}
