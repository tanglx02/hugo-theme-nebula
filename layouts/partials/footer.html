<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-copy">© {{ now.Year }} {{ site.Title }}{{ with site.Params.footerText }} · {{ . }}{{ end }}</div>
    <div class="footer-links">
      {{ range site.Menus.footer }}
        <a href="{{ partial "util/rel-url.html" .URL }}" {{ with .Params.external }}target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <a href="{{ "index.xml" | relURL }}">RSS</a>
      <a href="{{ "sitemap.xml" | relURL }}">{{ i18n "common.sitemap" }}</a>
    </div>
    {{ with site.Params.icp }}
    <div class="footer-icp"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">{{ . }}</a></div>
    {{ end }}
  </div>
</footer>
