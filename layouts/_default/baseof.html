<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "zh-CN" }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="progress-bar" id="progressBar"></div>

  {{ partial "header.html" . }}

  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  {{ partial "search-modal.html" . }}

  <button class="to-top" id="toTop" aria-label="返回顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <div class="lightbox" id="lightbox" aria-hidden="true"><img alt=""></div>

  {{ partial "scripts.html" . }}
</body>
</html>
