<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "zh-CN" }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body data-lightbox="{{ .Params.lightbox | default true }}">
  <div class="progress-bar" id="progressBar"></div>

  {{ partial "header.html" . }}

  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  {{ partial "search-modal.html" . }}

  <button class="to-top" id="toTop" aria-label="返回顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true"
       aria-label="图片预览，按 Esc 关闭" tabindex="-1" aria-hidden="true">
    <img alt="">
    <button class="lightbox-close" type="button" aria-label="关闭图片预览">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  {{ partial "scripts.html" . }}
</body>
</html>
