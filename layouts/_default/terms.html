{{ define "main" }}
<div class="card page-head">
  <nav class="breadcrumb">
    <a href="{{ site.Home.RelPermalink }}">首页</a><span>/</span><span>{{ .Title }}</span>
  </nav>
  <h1>{{ .Title }}</h1>
  <p>{{ with .Params.description }}{{ . }}{{ else }}共 {{ len .Data.Terms }} 项{{ end }}</p>
</div>

<div class="term-grid">
  {{ range .Data.Terms.Alphabetical }}
    <a class="term-card" href="{{ .Page.RelPermalink }}">
      <h3>{{ .Page.Title }}</h3>
      <p>{{ .Count }} 篇文章</p>
    </a>
  {{ end }}
</div>
{{ end }}
