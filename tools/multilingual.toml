# 测试 / CI 用：真实 Hugo multilingual 构建
#   zh-CN 在根路径（URL 与单语言版完全一致），en 在 /en/ 子路径。
#   语言键 = i18n 文件名（zh-CN.yaml / en.yaml）。
#   en 使用独立 contentDir（content-en/），单语言构建不会扫描该目录，避免污染。
defaultContentLanguage = 'zh-CN'
locale = 'zh-CN'

[params]
  # en 侧只有少量翻译文章，调低首页展示数保证"浏览更多"链接渲染（供 verify_i18n 断言）
  homePostCount = 1

[languages]
  [languages.zh-CN]
    label = '简体中文'
    weight = 1
    languageCode = 'zh-CN'
  [languages.en]
    label = 'English'
    weight = 2
    languageCode = 'en-US'
    # 独立 contentDir：单语言构建完全不会扫描 content-en/，避免污染
    contentDir = 'content-en'
