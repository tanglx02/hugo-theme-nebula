name = "Nebula"
license = "MIT"
licenselink = "https://github.com/tanglx02/hugo-theme-nebula/blob/main/LICENSE"
description = "一款清爽、现代的 Hugo 博客主题：多种首页布局、完整全文搜索、暗色模式、响应式图片画廊、Mermaid / KaTeX、多作者与外链文章、外观配置。"
homepage = "https://github.com/tanglx02/hugo-theme-nebula"
demosite = "https://blog.kejilion.pro"
tags = ["blog", "chinese", "responsive", "dark-mode", "search", "minimal",
        "gallery", "mermaid", "katex", "i18n", "accessible"]
features = [
  "四种首页布局（cards / profile / hero / landing，可配置且安全回退）",
  "全站搜索（完整全文，支持分片索引，`auto` 按体积自动选择）",
  "暗色模式",
  "响应式布局",
  "阅读体验（按正文区映射的进度条 / 返回顶部 / 专注模式 / 打印样式）",
  "代码高亮与一键复制",
  "正向内容组件：提示块 / 标签页 / 步骤 / 文件树 / 徽标 / 按钮（URL scheme 校验）/ 折叠块",
  "响应式图片画廊（复用图片 Pipeline 与灯箱）",
  "Mermaid 图表与 KaTeX 数学公式（默认零第三方请求，按需加载）",
  "文章目录 TOC",
  "侧边栏组件",
  "灯箱（键盘与焦点无障碍）",
  "多作者（meta / JSON-LD / RSS / 卡片全文一致）",
  "外链文章（推荐阅读卡片）与「编辑此页」入口",
  "外观配置（强调色 / 正文宽度 / 行高 / 字体 / 卡片密度）",
  "i18n：内置 zh-CN / zh-TW / en",
  "SEO 优化",
  "RSS / sitemap / robots",
]
# 最低版本经真实构建验证（CI 矩阵同时验证 0.128.0 / 0.148.0 / 0.162.0 / 0.166.0 / 0.167.0 / latest）：
#   theme.toml 与 README「版本兼容」表保持一致
# 关于搜索索引：
#   - 分片模式（params.search.mode = "shard"）依赖 resources.Publish，需要 Hugo 0.166+；
#     在更低版本上**显式报错**并给出替代方案（不静默降级）。
#   - 默认的 auto 模式在低版本超过阈值时会**自动回退为单文件索引**（打 WARN），
#     因此默认配置在 0.128.0 起即可正常构建，全文搜索能力不变。
min_version = "0.128.0"

[author]
  name = "tanglx02"
  homepage = "https://github.com/tanglx02"

[original]
  name = "Nebula"
  homepage = "https://github.com/tanglx02/hugo-theme-nebula"
  repo = "https://github.com/tanglx02/hugo-theme-nebula"
